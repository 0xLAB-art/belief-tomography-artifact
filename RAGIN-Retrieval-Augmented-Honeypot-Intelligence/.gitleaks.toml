# Gitleaks configuration for this repository.
#
# Extends the default rules (real secret patterns stay enforced) and
# allowlists only the paths where credential-shaped text is research
# material rather than a leak:
#   - results/ and data/: honeypot transcripts and evaluation artifacts.
#     Their bait credentials are registered canaries deployed on purpose
#     (the paper's artifact-safety anchors, Appendix E).
#   - gateway.tar: a Docker image export of the gateway; it bundles the
#     container's TLS key, which is used only inside that image and is
#     not a repository secret. Prefer removing the tarball from history
#     over extending this allowlist further.
# Everything else (source, scripts, workflows, config) falls under the
# default Gitleaks rules.
#
# Also allowlisted: the test fixtures' well-known placeholder tokens
# ("test-key", example API keys in conftest) and this file itself.

[extend]
useDefault = true

[allowlist]
description = "Research artifacts, image exports, test fixtures, dev placeholders"
paths = [
  '''(^|/)results/''',
  '''(^|/)data/''',
  '''(^|/)gateway\.tar$''',
  '''(^|/)tests/''',
  '''(^|/)attacker_report\.md$''',
  '''(^|/)attacker_log\.jsonl$''',
  '''(^|/)\.gitleaks\.toml$''',
]
# Each regex below was verified against a concrete finding; the path
# allowlist above is the primary control for the canary-bearing
# research artifacts.
regexes = [
  # committed dev placeholder used by scripts and docs
  '''ragin-test-key-2024''',
  # doc placeholder (docs/DEPLOYMENT_CHECKLIST.md env template)
  '''(?i)ragin_api_key=ragin-\.\.\.''',
  '''(?i)azure_openai_key=<key>''',
  # fabricated IMDS session-token example in the deception engine's
  # design comment (deception.py v3 replay note)
  '''FQoGZXIvYXdzEBYaD''',
  # fabricated provider key in the honeypot's fake attacker prompt
  '''gsk_abcd1234efgh5678''',
  # masked IMDS credential shape in a design comment
  '''ASIAV\*+''',
  # fake attacker-shell prompt generated by the honeypot itself
  '''HOSTNAME=\{host\}''',
  # example/fixture tokens in docs and tests
  '''(?i)example(api)?[_-]?key''',
  '''(?i)dummy[-_ ]?(key|secret|token)''',
  '''(?i)mock[-_ ]?not[-_ ]?used''',
  '''(?i)your[-_]?api[-_]?key''',
]
