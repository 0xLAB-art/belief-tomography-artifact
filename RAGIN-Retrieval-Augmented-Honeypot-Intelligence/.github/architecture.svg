<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="700" viewBox="0 0 1470 700" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151d"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrGhost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1470" height="700" fill="url(#bg)"/>
  <rect width="1470" height="240" fill="url(#glow)"/>

  <!-- title -->
  <text x="40" y="34" font-size="19" font-weight="700" fill="#f0f6fc">The Verified Deception Loop</text>
  <rect x="40" y="44" width="220" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="40" y="66" font-size="12" fill="#8b949e">Every served response is verified against session state — or served from vetted deterministic content.</text>

  <!-- ==================== attacker entry ==================== -->
  <rect x="40" y="92" width="140" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2" filter="url(#ds)"/>
  <text x="110" y="116" font-size="13" font-weight="600" text-anchor="middle" fill="#e6edf3">Attacker</text>
  <text x="110" y="134" font-size="10.5" text-anchor="middle" fill="#8b949e">session in</text>
  <line x1="180" y1="120" x2="193" y2="120" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>

  <!-- ==================== spine nodes (x 200-440) ==================== -->
  <!-- Profile -->
  <rect x="200" y="92" width="240" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4" filter="url(#ds)"/>
  <rect x="200" y="92" width="240" height="2.5" rx="1" fill="url(#accent)"/>
  <text x="320" y="116" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Profile — Chrollo</text>
  <text x="320" y="134" font-size="11" text-anchor="middle" fill="#8b949e">behavioral classification</text>
  <rect x="412" y="98" width="24" height="16" rx="4" fill="url(#chip)"/>
  <text x="424" y="110" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">R1</text>

  <!-- Retrieve -->
  <rect x="200" y="202" width="240" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4" filter="url(#ds)"/>
  <rect x="200" y="202" width="240" height="2.5" rx="1" fill="url(#accent)"/>
  <text x="320" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Retrieve — Don</text>
  <text x="320" y="244" font-size="11" text-anchor="middle" fill="#8b949e">RAG over curated CTI</text>
  <rect x="412" y="208" width="24" height="16" rx="4" fill="url(#chip)"/>
  <text x="424" y="220" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">R2</text>

  <!-- Fiction Graph (store) -->
  <rect x="200" y="312" width="240" height="56" rx="8" fill="#1c2a3a" stroke="#3b4d63" stroke-width="1.4" filter="url(#ds)"/>
  <text x="320" y="336" font-size="14" font-weight="600" text-anchor="middle" fill="#c9d1d9">Fiction Graph</text>
  <text x="320" y="354" font-size="11" text-anchor="middle" fill="#8b949e">per-session triple store</text>

  <!-- Draft -->
  <rect x="200" y="422" width="240" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4" filter="url(#ds)"/>
  <rect x="200" y="422" width="240" height="2.5" rx="1" fill="url(#accent)"/>
  <text x="320" y="446" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Draft — generator LLM</text>
  <text x="320" y="464" font-size="11" text-anchor="middle" fill="#8b949e">steering context</text>
  <rect x="412" y="428" width="24" height="16" rx="4" fill="url(#chip)"/>
  <text x="424" y="440" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">R3</text>

  <!-- Verify (gate) -->
  <rect x="200" y="532" width="240" height="56" rx="8" fill="#2a2113" stroke="#e3b341" stroke-width="1.8" filter="url(#ds)"/>
  <text x="320" y="556" font-size="14" font-weight="600" text-anchor="middle" fill="#f0f6fc">Verify</text>
  <text x="320" y="574" font-size="11" text-anchor="middle" fill="#d9a62e">danger + identity + consistency</text>

  <!-- Serve -->
  <rect x="200" y="642" width="240" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.4" filter="url(#ds)"/>
  <rect x="200" y="642" width="240" height="2.5" rx="1" fill="#3fb950"/>
  <text x="320" y="673" font-size="14" font-weight="600" text-anchor="middle" fill="#e6edf3">Serve on wire</text>

  <!-- ==================== side column (x 990-1250) ==================== -->
  <!-- Jev ghost (folded down) -->
  <rect x="990" y="92" width="260" height="84" rx="8" fill="#11161c" stroke="#55606e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1120" y="126" font-size="14" font-weight="600" text-anchor="middle" fill="#7d8590">Jev — kind-awareness</text>
  <text x="1120" y="144" font-size="11" text-anchor="middle" fill="#6e7681">top rung · folded down to R1 floor (Δ = 0.0)</text>
  <rect x="1216" y="98" width="28" height="16" rx="4" fill="none" stroke="#a371f7" stroke-width="1.2"/>
  <text x="1230" y="110" font-size="9.5" font-weight="700" text-anchor="middle" fill="#a371f7">TOP</text>

  <!-- CTI Corpus (store) -->
  <rect x="990" y="202" width="260" height="56" rx="8" fill="#1c2a3a" stroke="#3b4d63" stroke-width="1.4" filter="url(#ds)"/>
  <text x="1120" y="226" font-size="14" font-weight="600" text-anchor="middle" fill="#c9d1d9">CTI Corpus</text>
  <text x="1120" y="244" font-size="11" text-anchor="middle" fill="#8b949e">780K docs · curated</text>

  <!-- Deception Plan (store) -->
  <rect x="990" y="312" width="260" height="56" rx="8" fill="#1c2a3a" stroke="#3b4d63" stroke-width="1.4" filter="url(#ds)"/>
  <text x="1120" y="336" font-size="14" font-weight="600" text-anchor="middle" fill="#c9d1d9">Deception Plan</text>
  <text x="1120" y="354" font-size="11" text-anchor="middle" fill="#8b949e">facts · bait · objectives</text>

  <!-- HITL Gate (gate) -->
  <rect x="990" y="532" width="260" height="56" rx="8" fill="#2a2113" stroke="#e3b341" stroke-width="1.8" filter="url(#ds)"/>
  <text x="1120" y="556" font-size="14" font-weight="600" text-anchor="middle" fill="#f0f6fc">HITL Gate</text>
  <text x="1120" y="574" font-size="11" text-anchor="middle" fill="#d9a62e">REQUIRE classes · audit trail</text>

  <!-- Canary Registry (store) -->
  <rect x="990" y="656" width="260" height="40" rx="8" fill="#1c2a3a" stroke="#3b4d63" stroke-width="1.4" filter="url(#ds)"/>
  <text x="1120" y="681" font-size="13" font-weight="600" text-anchor="middle" fill="#c9d1d9">Canary Registry — honeytoken secrets</text>

  <!-- ==================== fallback (x 40-180) ==================== -->
  <rect x="40" y="532" width="140" height="56" rx="8" fill="#151a20" stroke="#55606e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="110" y="556" font-size="13" font-weight="600" text-anchor="middle" fill="#9aa4af">Fallback</text>
  <text x="110" y="574" font-size="10.5" text-anchor="middle" fill="#6e7681">R0 · vetted transcripts</text>
  <rect x="152" y="538" width="24" height="16" rx="4" fill="none" stroke="#6e7681" stroke-width="1.2"/>
  <text x="164" y="550" font-size="10" font-weight="700" text-anchor="middle" fill="#8b949e">R0</text>

  <!-- ==================== arrows: serving path ==================== -->
  <line x1="320" y1="148" x2="320" y2="196" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="332" y="178" font-size="11" fill="#9aa4af" paint-order="stroke" stroke="#10151d" stroke-width="4">class + tier</text>

  <line x1="320" y1="258" x2="320" y2="306" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="332" y="288" font-size="11" fill="#9aa4af" paint-order="stroke" stroke="#10151d" stroke-width="4">plan facts</text>

  <line x1="320" y1="368" x2="320" y2="416" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="332" y="398" font-size="11" fill="#9aa4af" paint-order="stroke" stroke="#10151d" stroke-width="4">committed facts</text>

  <line x1="320" y1="478" x2="320" y2="526" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="332" y="508" font-size="11" fill="#9aa4af" paint-order="stroke" stroke="#10151d" stroke-width="4">draft</text>

  <line x1="320" y1="588" x2="320" y2="636" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="332" y="618" font-size="11" fill="#3fb950" paint-order="stroke" stroke="#10151d" stroke-width="4">pass · verified</text>

  <!-- verify -> HITL (dashed amber) -->
  <line x1="440" y1="560" x2="984" y2="560" stroke="#e3b341" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="590" y="550" font-size="11" fill="#d9a62e" paint-order="stroke" stroke="#10151d" stroke-width="4">REQUIRE</text>

  <!-- HITL -> serve (approved) -->
  <path d="M 990,574 H 720 V 668 H 446" fill="none" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="560" y="660" font-size="11" fill="#9aa4af" paint-order="stroke" stroke="#10151d" stroke-width="4">approved</text>

  <!-- retrieve <-> CTI -->
  <line x1="440" y1="224" x2="984" y2="224" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="700" y="214" font-size="11" fill="#9aa4af" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">queries</text>
  <line x1="990" y1="246" x2="446" y2="246" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="700" y="264" font-size="11" fill="#9aa4af" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">grounded docs</text>

  <!-- graph -> Plan -->
  <line x1="440" y1="340" x2="984" y2="340" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="700" y="330" font-size="11" fill="#9aa4af" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">binds</text>

  <!-- Plan -> Draft (elbow) -->
  <path d="M 1120,368 V 450 H 446" fill="none" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="720" y="442" font-size="11" fill="#9aa4af" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">fact block + steering context</text>

  <!-- Canary -> Draft -->
  <path d="M 990,676 H 760 V 500 H 400 V 484" fill="none" stroke="#79c0ff" stroke-width="1.8" marker-end="url(#arrL)"/>
  <text x="580" y="492" font-size="11" fill="#9aa4af" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">canary bait</text>

  <!-- ==================== arrows: failure / assessment (dashed grey) ==================== -->
  <!-- verify fail -> fallback -->
  <line x1="200" y1="560" x2="186" y2="560" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="193" y="550" font-size="10" fill="#8b949e" text-anchor="end" paint-order="stroke" stroke="#10151d" stroke-width="4">fail</text>

  <!-- fallback -> serve -->
  <path d="M 110,588 V 668 H 194" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <text x="150" y="658" font-size="10" fill="#8b949e" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">serve vetted</text>

  <!-- Jev assessment -> Profile (ghost) -->
  <line x1="990" y1="134" x2="446" y2="134" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrGhost)"/>
  <text x="700" y="124" font-size="10" fill="#6e7681" text-anchor="middle" paint-order="stroke" stroke="#10151d" stroke-width="4">assessment — off the serving path</text>

  <!-- stack caption -->
  <text x="1120" y="712" font-size="11" fill="#6e7681" text-anchor="middle">Redis · Prometheus · Grafana · nginx TLS</text>

  <!-- legend -->
  <text x="200" y="712" font-size="11" fill="#8b949e">solid: serving path&#160;&#160;·&#160;&#160;dashed: failure / assessment&#160;&#160;·&#160;&#160;amber: gates&#160;&#160;·&#160;&#160;blue fill: stores&#160;&#160;·&#160;&#160;chips: ladder rungs</text>
</svg>
