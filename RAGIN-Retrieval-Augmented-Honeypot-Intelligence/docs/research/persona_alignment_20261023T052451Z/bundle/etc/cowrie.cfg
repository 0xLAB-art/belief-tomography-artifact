# RAGIN persona lab v1 — Cowrie v3.1.1 supported configuration only.
#
# This is an operator overlay. Cowrie stacks it on top of the bundled
# cowrie.cfg.dist. Every key below is documented in that bundled file.
#
# The listener endpoints are also provided through COWRIE_* environment
# variables by scripts/prove_cowrie_persona_alignment_v1.py so each proof run
# gets fresh ephemeral loopback ports. The values here are the loopback-only
# fallback and are deliberately not public interfaces.
#
# The prompt is intentionally NOT set in [honeypot]. Cowrie's native shell
# derives it from the passwd home directory and prints "~" when cwd == home.
# That keeps the supported command handlers and the prompt source aligned.

[honeypot]
hostname = web-srv-01
backend = shell
etc_path = /cowrie-persona/etc
contents_path = /cowrie-persona/honeyfs

[ssh]
listen_endpoints = tcp:2222:interface=127.0.0.1
sftp_enabled = false
forwarding = false

[telnet]
listen_endpoints = tcp:2223:interface=127.0.0.1

[shell]
filesystem = /cowrie-persona/fs.pickle
kernel_version = 5.15.0-91-generic
kernel_build_string = #167-Ubuntu SMP
hardware_platform = x86_64
operating_system = GNU/Linux
