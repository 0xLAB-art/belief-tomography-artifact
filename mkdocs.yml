site_name: Belief–Claim Gap — Artifact Documentation
site_description: "Complete research artifact repository for 'Measuring the Belief–Claim Gap: Disentangling Autonomous-Agent Beliefs from Security Certification' (IEEE TDSC submission)."
site_url: https://0xlab-art.github.io/belief-tomography-artifact/
repo_url: https://github.com/0xLAB-art/belief-tomography-artifact
repo_name: 0xLAB-art/belief-tomography-artifact
docs_dir: documentation
site_dir: site
copyright: "Artifact repository — IEEE TDSC single-anonymous review (author-visible manuscript, anonymous commit identity) · Apache License 2.0"

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: light blue
  features:
    - navigation.top
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Verification: verifying.md
  - Repository map: repo_map.md
  - Ledger guide: guide.md
  - Experiment index: experiments_index.md
  - Reviewer bundle: reviewer_bundle.md
  - Data & privacy: data_privacy.md
  - License: license.md
